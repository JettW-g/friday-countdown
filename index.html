<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下班倒计时</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c10;
      --panel:     #0f1318;
      --border:    #1e2530;
      --accent:    #f5c518;
      --accent2:   #ff6b35;
      --dim:       #3a4455;
      --text:      #c8d4e8;
      --text-muted:#5a6a82;
      --glow:      rgba(245,197,24,0.35);
      --glow2:     rgba(255,107,53,0.25);
      --digit-h:   140px;
      --digit-w:   110px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans SC', sans-serif;
      overflow: hidden;
    }

    /* ─── Noise Overlay ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.6;
    }

    /* ─── Scan Lines ─── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 998;
    }

    /* ─── Layout ─── */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
    }

    /* ─── Corner Decorations ─── */
    .corner {
      position: fixed;
      width: 60px;
      height: 60px;
      border-color: var(--dim);
      border-style: solid;
      opacity: 0.5;
    }
    .corner--tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
    .corner--tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
    .corner--bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
    .corner--br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }

    /* ─── Grid Background ─── */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(30,37,48,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,37,48,0.4) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ─── Header ─── */
    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.8s ease both;
    }

    .header__eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.35em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .header__eyebrow::before,
    .header__eyebrow::after {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    .header__title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 6vw, 72px);
      letter-spacing: 0.12em;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 40px rgba(245,197,24,0.2);
    }

    .header__sub {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      margin-top: 10px;
      font-weight: 300;
    }

    /* ─── Status Badge ─── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 36px;
      background: rgba(15,19,24,0.8);
      animation: fadeDown 0.8s 0.1s ease both;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot.off {
      background: var(--accent2);
      box-shadow: 0 0 8px var(--accent2);
      animation: none;
    }

    /* ─── Main Clock Panel ─── */
    .clock-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 40px 48px;
      position: relative;
      animation: fadeUp 0.9s 0.2s ease both;
      box-shadow:
        0 0 0 1px rgba(245,197,24,0.05),
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* Panel accent line */
    .clock-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 40px; right: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    /* Panel label */
    .clock-panel::after {
      content: 'COUNTDOWN SYSTEM v2.1';
      position: absolute;
      bottom: -1px; right: 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--dim);
      background: var(--panel);
      padding: 0 8px;
    }

    /* ─── Digit Groups ─── */
    .digits-row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .digit-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .digit-group__label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      order: 2;
    }

    .digit-group__slots {
      display: flex;
      gap: 4px;
      order: 1;
    }

    /* ─── Separator ─── */
    .sep {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 16px;
      padding-bottom: 30px;
      align-self: center;
    }

    .sep__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--glow);
      animation: blink 1s step-end infinite;
    }

    /* ─── Single Digit Slot ─── */
    .slot {
      width: var(--digit-w);
      height: var(--digit-h);
      background: #080a0d;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,0.8),
        0 0 0 1px rgba(0,0,0,0.5);
    }

    /* Slot top/bottom fade masks */
    .slot::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(8,10,13,0.95) 0%,
        transparent 25%,
        transparent 75%,
        rgba(8,10,13,0.95) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    /* Slot center highlight line */
    .slot::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.15;
      z-index: 3;
    }

    /* ─── Digit Reel ─── */
    .reel {
      position: absolute;
      left: 0; right: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .reel__item {
      width: 100%;
      height: var(--digit-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 88px;
      color: var(--accent);
      text-shadow:
        0 0 20px var(--glow),
        0 0 60px rgba(245,197,24,0.1);
      letter-spacing: 0.02em;
      flex-shrink: 0;
      user-select: none;
    }

    /* ─── Weekend / Zero State ─── */
    .slot.is-zero .reel__item {
      color: var(--dim);
      text-shadow: none;
    }

    .slot.is-zero::after {
      opacity: 0;
    }

    /* ─── Info Bar ─── */
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      gap: 24px;
      flex-wrap: wrap;
      animation: fadeUp 0.9s 0.35s ease both;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-item__label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .info-item__value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.1em;
    }

    .info-item__value.accent { color: var(--accent); }
    .info-item__value.accent2 { color: var(--accent2); }

    /* ─── Progress Bar ─── */
    .progress-wrap {
      margin-top: 28px;
      animation: fadeUp 0.9s 0.45s ease both;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-header span {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .progress-track {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 2px;
      transition: width 1s linear;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0; top: -3px;
      width: 2px; height: 9px;
      background: #fff;
      border-radius: 1px;
      box-shadow: 0 0 6px #fff;
    }

    /* ─── Weekend Message ─── */
    .weekend-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8,10,13,0.92);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .weekend-msg.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .weekend-msg__icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255,107,53,0.5));
    }

    .weekend-msg__title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 0.15em;
      color: var(--accent2);
      text-shadow: 0 0 30px var(--glow2);
      margin-bottom: 8px;
    }

    .weekend-msg__sub {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      font-weight: 300;
    }

    /* ─── Glow Pulse on active slots ─── */
    .slot:not(.is-zero) {
      animation: slotGlow 4s ease-in-out infinite;
    }
    @keyframes slotGlow {
      0%, 100% { box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,0,0,0.5); }
      50%       { box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 12px rgba(245,197,24,0.12), 0 0 0 1px rgba(245,197,24,0.08); }
    }

    /* ─── Animations ─── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 700px) {
      :root {
        --digit-h: 90px;
        --digit-w: 68px;
      }
      .reel__item { font-size: 56px; }
      .clock-panel { padding: 28px 20px; }
      .sep { padding: 0 8px; padding-bottom: 30px; gap: 12px; }
      .sep__dot { width: 5px; height: 5px; }
      .header__title { font-size: 36px; }
      .info-bar { gap: 16px; }
    }

    @media (max-width: 420px) {
      :root {
        --digit-h: 72px;
        --digit-w: 52px;
      }
      .reel__item { font-size: 44px; }
      .clock-panel { padding: 20px 12px; }
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="header__eyebrow">SYSTEM ONLINE</div>
    <h1 class="header__title">下班倒计时</h1>
    <p class="header__sub">FRIDAY 18:00 · COUNTDOWN TERMINAL</p>
  </div>

  <!-- Status Badge -->
  <div class="status-badge" id="statusBadge">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">正在计算...</span>
  </div>

  <!-- Clock Panel -->
  <div class="clock-panel" style="position:relative;">

    <!-- Weekend overlay message -->
    <div class="weekend-msg" id="weekendMsg">
      <div class="weekend-msg__icon">🎉</div>
      <div class="weekend-msg__title">自由时间</div>
      <div class="weekend-msg__sub">ENJOY YOUR WEEKEND · 下周一重置</div>
    </div>

    <!-- Digit Row -->
    <div class="digits-row" id="digitsRow">

      <!-- Days -->
      <div class="digit-group">
        <div class="digit-group__label">天</div>
        <div class="digit-group__slots">
          <div class="slot" id="d0"><div class="reel" id="reel-d0"></div></div>
          <div class="slot" id="d1"><div class="reel" id="reel-d1"></div></div>
        </div>
      </div>

      <div class="sep"><div class="sep__dot"></div><div class="sep__dot"></div></div>

      <!-- Hours -->
      <div class="digit-group">
        <div class="digit-group__label">时</div>
        <div class="digit-group__slots">
          <div class="slot" id="h0"><div class="reel" id="reel-h0"></div></div>
          <div class="slot" id="h1"><div class="reel" id="reel-h1"></div></div>
        </div>
      </div>

      <div class="sep"><div class="sep__dot"></div><div class="sep__dot"></div></div>

      <!-- Minutes -->
      <div class="digit-group">
        <div class="digit-group__label">分</div>
        <div class="digit-group__slots">
          <div class="slot" id="m0"><div class="reel" id="reel-m0"></div></div>
          <div class="slot" id="m1"><div class="reel" id="reel-m1"></div></div>
        </div>
      </div>

      <div class="sep"><div class="sep__dot"></div><div class="sep__dot"></div></div>

      <!-- Seconds -->
      <div class="digit-group">
        <div class="digit-group__label">秒</div>
        <div class="digit-group__slots">
          <div class="slot" id="s0"><div class="reel" id="reel-s0"></div></div>
          <div class="slot" id="s1"><div class="reel" id="reel-s1"></div></div>
        </div>
      </div>

    </div><!-- /digits-row -->

    <!-- Info Bar -->
    <div class="info-bar">
      <div class="info-item">
        <div class="info-item__label">当前时间</div>
        <div class="info-item__value" id="currentTime">--:--:--</div>
      </div>
      <div class="info-item">
        <div class="info-item__label">目标时间</div>
        <div class="info-item__value accent" id="targetTime">周五 18:00</div>
      </div>
      <div class="info-item">
        <div class="info-item__label">今日</div>
        <div class="info-item__value" id="todayDay">---</div>
      </div>
      <div class="info-item">
        <div class="info-item__label">总秒数</div>
        <div class="info-item__value accent2" id="totalSecs">------</div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-wrap">
      <div class="progress-header">
        <span>本周进度</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

  </div><!-- /clock-panel -->

</div><!-- /page -->

<script>
  /* ─────────────────────────────────────────────
     Reel Setup
     Each slot shows digits 0–9 in a vertical strip.
     We offset the strip so the correct digit is centered.
  ───────────────────────────────────────────── */

  const SLOT_IDS = ['d0','d1','h0','h1','m0','m1','s0','s1'];
  const reels = {};

  function buildReel(id) {
    const reel = document.getElementById('reel-' + id);
    // Build 0–9 items
    for (let i = 0; i <= 9; i++) {
      const item = document.createElement('div');
      item.className = 'reel__item';
      item.textContent = i;
      reel.appendChild(item);
    }
    reels[id] = { el: reel, current: -1 };
  }

  SLOT_IDS.forEach(buildReel);

  function setDigit(id, digit) {
    const r = reels[id];
    if (r.current === digit) return;
    r.current = digit;
    // Offset: digit index * slot height (CSS var --digit-h)
    const h = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--digit-h'));
    r.el.style.transform = `translateY(${-digit * h}px)`;
  }

  function setZeroState(isZero) {
    SLOT_IDS.forEach(id => {
      const slot = document.getElementById(id);
      if (isZero) slot.classList.add('is-zero');
      else slot.classList.remove('is-zero');
    });
    // Show/hide weekend overlay
    const msg = document.getElementById('weekendMsg');
    if (isZero) msg.classList.add('visible');
    else msg.classList.remove('visible');
  }

  /* ─────────────────────────────────────────────
     Time Logic
  ───────────────────────────────────────────── */

  const DAY_NAMES = ['日','一','二','三','四','五','六'];
  const DAY_NAMES_FULL = ['周日','周一','周二','周三','周四','周五','周六'];

  /**
   * Returns seconds remaining until next Friday 18:00.
   * Returns 0 if currently in "free time":
   *   - Friday 18:00 ~ Sunday 23:59:59
   *   - Saturday all day
   *   - Sunday all day
   * Resets on Monday 00:00.
   */
  function getCountdownSeconds() {
    const now = new Date();
    const dow = now.getDay(); // 0=Sun,1=Mon,...,5=Fri,6=Sat
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    // Free time: Fri 18:00+ OR Sat OR Sun
    const isFriAfter18 = (dow === 5 && (h > 18 || (h === 18 && m === 0 && s === 0)));
    const isFriAfterExact = (dow === 5 && h >= 18);
    const isSat = (dow === 6);
    const isSun = (dow === 0);

    if (isFriAfterExact || isSat || isSun) {
      return -1; // free time
    }

    // Find next Friday 18:00
    // Days until Friday: (5 - dow + 7) % 7, but if today is Friday before 18:00, same day
    let daysUntilFri;
    if (dow === 5) {
      // It's Friday, before 18:00
      daysUntilFri = 0;
    } else {
      daysUntilFri = (5 - dow + 7) % 7;
    }

    // Build target date
    const target = new Date(now);
    target.setDate(target.getDate() + daysUntilFri);
    target.setHours(18, 0, 0, 0);

    const diff = Math.floor((target - now) / 1000);
    return Math.max(0, diff);
  }

  /**
   * Total seconds in a work week from Monday 00:00 to Friday 18:00
   * = 4 days + 18 hours = (4*24 + 18) * 3600 = 108 * 3600 = 388800
   */
  const WEEK_TOTAL = (4 * 24 + 18) * 3600;

  function getWeekProgress() {
    const now = new Date();
    const dow = now.getDay();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    if (dow === 0 || dow === 6) return 100; // weekend
    if (dow === 5 && h >= 18) return 100;

    // Seconds elapsed since Monday 00:00
    const daysSinceMon = (dow === 0 ? 6 : dow - 1);
    const elapsed = daysSinceMon * 86400 + h * 3600 + m * 60 + s;
    return Math.min(100, (elapsed / WEEK_TOTAL) * 100);
  }

  /* ─────────────────────────────────────────────
     Render Loop
  ───────────────────────────────────────────── */

  function pad2(n) { return String(n).padStart(2, '0'); }

  function render() {
    const now = new Date();
    const dow = now.getDay();
    const secs = getCountdownSeconds();

    // Current time display
    document.getElementById('currentTime').textContent =
      `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;

    // Today label
    document.getElementById('todayDay').textContent = DAY_NAMES_FULL[dow];

    if (secs === -1) {
      // ── Free time ──
      setZeroState(true);
      ['d0','d1','h0','h1','m0','m1','s0','s1'].forEach(id => setDigit(id, 0));

      document.getElementById('statusDot').classList.add('off');
      document.getElementById('statusText').textContent = '自由时间 · 享受周末';
      document.getElementById('totalSecs').textContent = '000000';
      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('progressPct').textContent = '100%';
      document.getElementById('targetTime').textContent = '下周一重置';

    } else {
      // ── Counting down ──
      setZeroState(false);

      const days  = Math.floor(secs / 86400);
      const hours = Math.floor((secs % 86400) / 3600);
      const mins  = Math.floor((secs % 3600) / 60);
      const sc    = secs % 60;

      const d0 = Math.floor(days / 10);
      const d1 = days % 10;
      const h0 = Math.floor(hours / 10);
      const h1 = hours % 10;
      const m0 = Math.floor(mins / 10);
      const m1 = mins % 10;
      const s0 = Math.floor(sc / 10);
      const s1 = sc % 10;

      setDigit('d0', d0);
      setDigit('d1', d1);
      setDigit('h0', h0);
      setDigit('h1', h1);
      setDigit('m0', m0);
      setDigit('m1', m1);
      setDigit('s0', s0);
      setDigit('s1', s1);

      document.getElementById('statusDot').classList.remove('off');
      document.getElementById('statusText').textContent = '倒计时进行中 · COUNTING DOWN';
      document.getElementById('totalSecs').textContent = String(secs).padStart(6, '0');

      // Progress
      const pct = getWeekProgress();
      document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
      document.getElementById('progressPct').textContent = pct.toFixed(1) + '%';
      document.getElementById('targetTime').textContent = '周五 18:00';
    }
  }

  // Init reels to 0 first
  SLOT_IDS.forEach(id => setDigit(id, 0));

  // Staggered startup animation
  setTimeout(() => {
    render();
    setInterval(render, 1000);
  }, 300);
</script>
</body>
</html>
